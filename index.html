<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sonique Product Catalog</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="https://soniquedrums.github.io/product-catalog/assets/s-favicon.png">

  <script src="https://cdn.jsdelivr.net/npm/jquery@2.2.4/dist/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/3/turn.min.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #1a1a1a;
    }

    #viewport {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #flipbook {
      position: relative;
    }

    #flipbook .page {
      background: #fff;
      overflow: hidden;
    }

    #flipbook .page img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    #controls {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 60px;
      background: #333;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-sizing: border-box;
      padding: 0 20px;
      z-index: 10;
    }

    #pageSlider {
      width: 70%;
    }

    #downloadPageBtn,
    #downloadPdfBtn {
      background: #222;
      color: white;
      padding: 8px 12px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
    }

    #downloadPageBtn:hover,
    #downloadPdfBtn:hover {
      background: #444;
    }
  </style>
</head>
<body>

<div id="controls">
  <input type="range" id="pageSlider" min="1" value="1">
  <button id="downloadPageBtn">Download Current Page</button>
  <button id="downloadPdfBtn">Download Full Catalog</button>
</div>
<div id="viewport">
  <div id="flipbook"></div>
</div>

<script>
  $(function () {
    if (!$.fn.turn) {
      console.error('Turn.js not loaded.');
      return;
    }

    const urlParams = new URLSearchParams(window.location.search);
    const selectedYear = urlParams.get('year');

    if (!selectedYear) {
      console.error('Catalog year is missing.');
      return;
    }

    const pageCountMapping = {
      '2026': 24,
      '2025': 24,
      '2024': 16
    };

    const totalPages = pageCountMapping[selectedYear];
    if (!totalPages) {
      console.error('No page count found for the selected year.');
      return;
    }

    const imagePrefix = `https://soniquedrums.github.io/product-catalog/assets/page-images/${selectedYear}/page_`;

    const pages = [];
    for (let i = 1; i <= totalPages; i++) {
      pages.push(`${imagePrefix}${i}.webp`);
    }

    // Book dimensions: maintain the 1275:1650 source aspect ratio
    const viewportW = window.innerWidth;
    const viewportH = window.innerHeight - 60;
    const pageAspect = 1650 / 1275;

    let pageW = Math.floor(viewportW / 2);
    let pageH = Math.round(pageW * pageAspect);

    if (pageH > viewportH) {
      pageH = viewportH;
      pageW = Math.round(pageH / pageAspect);
    }

    const bookW = pageW * 2;
    const bookH = pageH;

    const $book = $('#flipbook');
    $book.css({ width: bookW, height: bookH });

    // Add pages with src set directly — Turn.js restructures the DOM after init
    // so data-src lazy loading breaks; let the browser load images naturally instead
    pages.forEach((url) => {
      $('<div class="page"><img src="' + url + '" /></div>').appendTo($book);
    });

    $book.turn({
      width: bookW,
      height: bookH,
      autoCenter: true,
      display: 'double',
      acceleration: true,
      gradients: true,
      elevation: 50,
      when: {
        turned: function (e, page) {
          document.getElementById('pageSlider').value = page;
        }
      }
    });

    // Turn.js only responds to corner drags by default; add full-page click-to-flip
    let wasDragging = false;
    $book
      .on('mousedown', function () { wasDragging = false; })
      .on('mousemove', function () { wasDragging = true; })
      .on('click', function (e) {
        if (wasDragging) { wasDragging = false; return; }
        const x = e.pageX - $book.offset().left;
        $book.turn(x < bookW / 2 ? 'previous' : 'next');
      });

    const pageSlider = document.getElementById('pageSlider');
    pageSlider.max = totalPages;

    pageSlider.addEventListener('input', function (e) {
      $book.turn('page', parseInt(e.target.value));
    });

    document.getElementById('downloadPageBtn').addEventListener('click', function () {
      const page = $book.turn('page');
      const url = pages[page - 1];
      const a = document.createElement('a');
      a.href = url;
      a.download = `catalog-page-${page}.webp`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    });

    document.getElementById('downloadPdfBtn').addEventListener('click', function () {
      const pdfUrl = `https://soniquedrums.github.io/product-catalog/assets/${selectedYear}_catalog.pdf`;
      const a = document.createElement('a');
      a.href = pdfUrl;
      a.download = `Sonique-Product-Catalog-${selectedYear}.pdf`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    });
  });
</script>

</body>
</html>
